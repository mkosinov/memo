# Production deploy (GH #616, spec §4.2–4.3): release → images → VPS.
#
# Triggers: `release: published` (one release = one rollout) or a manual
# workflow_dispatch with a tag — rollback is a CONSCIOUS dispatch with the
# previous release tag (§4.3: no auto-rollback by design).
#
#   build  — checkout the TAG NAME (never github.sha: for annotated tags the
#            event sha is unreliable), build the 3 prod images with buildx +
#            GHA layer cache, push them tagged with the release tag.
#   deploy — queue on `prod-deploy` (parallel rollouts forbidden — one SQLite
#            writer), scp deploy.sh + render-env.sh + docker-compose.prod.yml
#            FROM THE RELEASE CHECKOUT (the deploy files always match the
#            deployed version), render /opt/memo/env/production.env from
#            GitHub Secrets (render-env.sh, payload over ssh stdin — never
#            argv) and run deploy.sh on the VPS.
#
# Registry namespace: `vars.REGISTRY_PREFIX` repo variable, default
# `ghcr.io/<owner>/<repo>` lowercased. The default MUST stay byte-equal to the
# compose-side default (deploy/docker-compose.prod.yml interpolates
# ${MEMO_REGISTRY_PREFIX:-ghcr.io/mkosinov/memo}) so a manual `deploy.sh <tag>`
# on the VPS without the env var pulls the same images CI pushed. GHCR rejects
# uppercase paths — the repo path is already lowercase, the tr keeps the
# workflow robust.
#
# Secrets (spec §3.3 rev.6): environment `production` gates the deploy trio
# DEPLOY_SSH_HOST / DEPLOY_SSH_USER / DEPLOY_SSH_KEY (VPS access) and
# REGISTRY_TOKEN (read:packages PAT, needed only when the images are
# private; deploy.sh skips registry login when it is empty). App secrets are
# REPO secrets named exactly like their env keys (SECRET_KEY, OTP_PEPPER, …
# — see the `render prod env` step): the deploy job forwards them to
# render-env.sh over ssh stdin — never argv, never disk on the runner —
# which renders /opt/memo/env/production.env on the VPS (atomic, 0600).
# REGISTRY_TOKEN likewise reaches the deploy invocation only via ssh stdin
# (consumed remotely via `$(cat)` into the environment) — never in any
# argv. GITHUB_TOKEN (packages: write) pushes the images in `build`.

name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build & deploy (rollback: the PREVIOUS release tag, spec §4.3)'
        required: true
        type: string

# Least privilege by default; `build` widens to packages: write locally.
permissions:
  contents: read

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      # Single source of truth for the tag: release event first, dispatch
      # input second. Fails closed when both are empty (misconfigured
      # dispatch) instead of silently building some random ref. The charset
      # check is an INJECTION guard: the tag is embedded (single-quoted)
      # in the remote deploy command below — a quote in it would break out
      # of the quoting and execute on the VPS.
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            echo "::error::No release tag: neither github.event.release.tag_name nor inputs.tag is set."
            exit 1
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid release tag '$tag': allowed charset is [A-Za-z0-9][A-Za-z0-9._-]* (the tag is embedded in the remote deploy command)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          # Spec §4.2: by tag name, not github.sha.
          ref: ${{ steps.tag.outputs.tag }}

      - name: Resolve registry prefix
        id: registry
        env:
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          prefix="${REGISTRY_PREFIX:-ghcr.io/${GITHUB_REPOSITORY}}"
          # GHCR paths are case-sensitive lowercase.
          prefix="$(printf '%s' "$prefix" | tr '[:upper:]' '[:lower:]')"
          prefix="${prefix%/}"
          if [ -z "$prefix" ] || [ "$prefix" = "${prefix#*/}" ]; then
            echo "::error::Registry prefix must be <host>/<namespace>, got '$prefix'."
            exit 1
          fi
          # Injection guard, same as the tag: the prefix is embedded in
          # the remote deploy command below.
          if [[ ! "$prefix" =~ ^[a-z0-9./_-]+$ ]]; then
            echo "::error::Invalid registry prefix '$prefix': allowed charset is [a-z0-9./_-]."
            exit 1
          fi
          {
            echo "prefix=$prefix"
            echo "host=${prefix%%/*}"
          } >> "$GITHUB_OUTPUT"
          echo "Registry host: ${prefix%%/*}, namespace prefix: $prefix"

      - name: Registry login (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          # Host of the resolved prefix (ghcr.io for the default). A non-GHCR
          # vars.REGISTRY_PREFIX override fails HERE, loudly, instead of as a
          # cryptic push error later.
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build args are baked into the Dockerfiles (public values only, spec
      # §3.3) — the workflow passes none. Contexts: backend image builds from
      # backend/; admin/edge need the repo root (pnpm workspace: packages/ +
      # root lockfile; edge serves the web SPA statics + nginx). Per-image
      # GHA cache scopes keep the three builds from evicting each other's
      # cache entries.
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: deploy/Dockerfile.backend
          push: true
          tags: ${{ steps.registry.outputs.prefix }}/backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=memo-backend
          cache-to: type=gha,mode=max,scope=memo-backend

      - name: Build & push admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.admin
          push: true
          tags: ${{ steps.registry.outputs.prefix }}/admin:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=memo-admin
          cache-to: type=gha,mode=max,scope=memo-admin

      - name: Build & push edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.edge
          push: true
          tags: ${{ steps.registry.outputs.prefix }}/edge:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=memo-edge
          cache-to: type=gha,mode=max,scope=memo-edge

    outputs:
      # Plain strings: job outputs accept no description metadata.
      tag: ${{ steps.tag.outputs.tag }}
      registry-prefix: ${{ steps.registry.outputs.prefix }}

  deploy:
    name: Deploy to production VPS
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Spec §4.2: one rollout at a time (single SQLite writer). Queued runs
    # WAIT — never cancel an in-flight deploy.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    # Spec §4.2: environment `production` gates the VPS secrets below.
    environment: production

    env:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      # Read:packages PAT; empty when the images are public — deploy.sh then
      # skips registry login.
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      DEPLOY_TAG: ${{ needs.build.outputs.tag }}
      MEMO_REGISTRY_PREFIX: ${{ needs.build.outputs.registry-prefix }}
      # App secrets (spec §3.3 rev.6): repo secrets named EXACTLY like the
      # env keys — the `render prod env` step forwards them to render-env.sh
      # on the VPS. Empty secrets are OMITTED from the payload there: an
      # empty `KEY=` line would override the app default with empty.
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
      BUSINESS_TIMEZONE: ${{ secrets.BUSINESS_TIMEZONE }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      OTP_TRANSPORT: ${{ secrets.OTP_TRANSPORT }}
      CALLCHECK_TRANSPORT: ${{ secrets.CALLCHECK_TRANSPORT }}
      SMSRU_CALLCHECK_API_KEY: ${{ secrets.SMSRU_CALLCHECK_API_KEY }}
      NOTIFICATION_ENABLED: ${{ secrets.NOTIFICATION_ENABLED }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      # Telegram relay account (backend/src/core/config.py contract);
      # TELEGRAM_SEND_PAUSE / TELEGRAM_DAILY_CAP are tuning knobs with
      # app defaults, not deploy secrets — deliberately absent.
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_ADMIN_PHONE: ${{ secrets.TELEGRAM_ADMIN_PHONE }}

    steps:
      # Spec §4.2: scp the deploy files FROM THE RELEASE CHECKOUT — deploy.sh
      # and compose always correspond to the deployed version.
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Setup SSH key and known_hosts
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Copy deploy files to the VPS
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "mkdir -p /opt/memo/deploy"
          scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
            deploy/deploy.sh deploy/render-env.sh deploy/docker-compose.prod.yml \
            "$SSH_USER@$SSH_HOST:/opt/memo/deploy/"

      # ── render prod env (spec §3.3 rev.6) ─────────────────────────────────
      #
      # Builds the env-file payload in a bash variable and pipes it over ssh
      # stdin into render-env.sh (scp'ed above), which renders
      # /opt/memo/env/production.env on the VPS atomically (0600). Secret
      # values NEVER appear in the remote command string (ssh argv is
      # visible in `ps` on the VPS) — stdin only — and the payload never
      # touches disk on the runner: a bash variable, NOT $GITHUB_ENV /
      # $GITHUB_OUTPUT (both persist to disk). Each workflow step is a
      # fresh shell, so the payload is built and piped in THIS step, before
      # the deploy invocation below.
      #
      # Silent by design: no set -x, no echo of the payload. GitHub also
      # auto-masks secret-derived values in logs — the step does not rely
      # on that, it simply prints nothing.
      #
      # emit KEY VALUE — append "KEY=VALUE" only when VALUE is non-empty:
      # render-env passes values through verbatim, and an empty repo secret
      # must NOT become `KEY=` (it would override the app default with
      # empty). Values are written raw via printf '%s=%s\n' — no quoting.
      # The fixed literals are always present.
      - name: render prod env
        run: |
          emit() {
            if [ -n "$2" ]; then printf '%s=%s\n' "$1" "$2"; fi
          }
          ENV_PAYLOAD="$(
            printf '%s=%s\n' 'ENV' 'production'
            printf '%s=%s\n' 'DATABASE_URL' 'sqlite+aiosqlite:////opt/memo/data/memo.db'
            printf '%s=%s\n' 'FILES_DIR' '/opt/memo/media'
            emit SECRET_KEY "${SECRET_KEY}"
            emit OTP_PEPPER "${OTP_PEPPER}"
            emit BUSINESS_TIMEZONE "${BUSINESS_TIMEZONE}"
            emit LOG_LEVEL "${LOG_LEVEL}"
            emit OTP_TRANSPORT "${OTP_TRANSPORT}"
            emit CALLCHECK_TRANSPORT "${CALLCHECK_TRANSPORT}"
            emit SMSRU_CALLCHECK_API_KEY "${SMSRU_CALLCHECK_API_KEY}"
            emit NOTIFICATION_ENABLED "${NOTIFICATION_ENABLED}"
            emit REDIS_URL "${REDIS_URL}"
            emit TELEGRAM_API_ID "${TELEGRAM_API_ID}"
            emit TELEGRAM_API_HASH "${TELEGRAM_API_HASH}"
            emit TELEGRAM_SESSION "${TELEGRAM_SESSION}"
            emit TELEGRAM_ADMIN_PHONE "${TELEGRAM_ADMIN_PHONE}"
          )"
          printf '%s' "$ENV_PAYLOAD" | ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd /opt/memo/deploy && chmod +x deploy.sh render-env.sh && ./render-env.sh"

      # ── deploy.sh interface (GH #616 subtask 2 — implement EXACTLY) ─────
      #
      # Remote layout (scp'ed from the release checkout):
      #   /opt/memo/deploy/deploy.sh
      #   /opt/memo/deploy/render-env.sh          (rendered the env file in
      #     the `render prod env` step above — BEFORE deploy.sh runs)
      #   /opt/memo/deploy/docker-compose.prod.yml   (same directory —
      #     deploy.sh runs docker compose next to itself)
      #
      # Invocation (cwd /opt/memo/deploy):
      #   ./deploy.sh <release-tag>
      #
      # Env provided by this workflow:
      #   MEMO_IMAGE_TAG        release tag — mirror of $1; the compose
      #                         interpolation variable (compose fails closed
      #                         without it: no silent `latest`)
      #   MEMO_REGISTRY_PREFIX  compose image namespace (same default as
      #                         compose itself)
      #   REGISTRY_TOKEN        optional; non-empty → docker login to pull
      #                         PRIVATE images; empty → no login. Piped over
      #                         ssh STDIN (consumed remotely by $(cat) into
      #                         the env) — never in any argv. deploy.sh must
      #                         never echo it.
      #
      # deploy.sh must (spec §4.2): pull the 3 tagged images (backend,
      # admin, edge), run `docker compose run --rm backend alembic upgrade
      # head` BEFORE `up -d`, then wait for http://127.0.0.1/api/v1/health
      # through edge :80 in a loop (python one-liner on the host — no curl
      # assumed). Any failure → non-zero exit → this job goes red; the
      # rollback path is a conscious re-dispatch with the previous tag
      # (§4.3).
      - name: Run deploy.sh on the VPS
        run: |
          # REGISTRY_TOKEN travels over ssh STDIN: the remote command
          # contains only the LITERAL `REGISTRY_TOKEN="$(cat)"` — the
          # command substitution runs on the REMOTE shell, consuming our
          # stdin into the env var. The token never appears in any argv:
          # not in the local ssh argv, not in the remote sh -c string —
          # invisible to `ps` on either side. DEPLOY_TAG and
          # MEMO_REGISTRY_PREFIX stay inline (single-quoted in the remote
          # string): both are charset-validated in the resolve steps
          # (build job), so a value cannot break out of the quoting.
          remote_cmd="cd /opt/memo/deploy && chmod +x deploy.sh && REGISTRY_TOKEN=\"\$(cat)\""
          remote_cmd+=" MEMO_IMAGE_TAG='$DEPLOY_TAG' MEMO_REGISTRY_PREFIX='$MEMO_REGISTRY_PREFIX' ./deploy.sh '$DEPLOY_TAG'"
          printf '%s' "$REGISTRY_TOKEN" | ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "$remote_cmd"
