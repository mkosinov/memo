name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # GH #416: один прогон всего набора с coverage-порогом вместо матрицы по
  # маркерам (4 джоба) + отдельного coverage-джоба. Каждый тест выполняется
  # ровно один раз; тесты без меток проверяются тем же прогоном. Маркеры
  # unit/api/integration/misc/pure_unit остаются локальными селекторами
  # (pytest -m …) — CI их не потребляет. Отказы: verbose-вывод + junit-артефакт.
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests (full suite, coverage threshold 80%)
        run: uv run pytest --cov=src --cov-report=xml --cov-fail-under=80 -n auto -v --tb=short --junitxml=test-results.xml

      - name: Upload junit results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: backend/test-results.xml
          if-no-files-found: warn
          retention-days: 7


  # Рахет-гейт lint/mypy (#306): быстрый сигнал, параллельно тестам —
  # без needs. Скрипт в PR-режиме делает git show <merge-base>:… —
  # checkout требует полную историю (fetch-depth: 0).
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint budget (ruff/mypy ratchet)
        run: uv run python scripts/lint_budget.py

  # GH #420: single run, no shards. The 2026-06 sharding existed to survive
  # OOM from heavy ClientRecordTab files — those were since split up and the
  # 4 GB NODE_OPTIONS limit is in place. Fallback if OOM returns: split into
  # 2–3 shards INSIDE this same job (still one check in the PR).
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: npx vitest run
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # GH #420: unit tests of every OTHER workspace package (packages/domain,
  # packages/api-client, frontend/web) — previously run by no gate at all.
  # The package list is derived from the workspace globs by the shared
  # scripts/run-workspace-tests.sh (also used by the local full suite), so a
  # new package with a test script joins this job automatically.
  workspace-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Run workspace unit tests
        run: bash scripts/run-workspace-tests.sh


  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      # Gate #322: api-client test fixtures are invisible to admin's tsc
      # (not imported anywhere) — check the package itself.
      - name: Type-check api-client
        run: pnpm run type-check
        working-directory: packages/api-client
      - name: z-token guard
        run: python3 scripts/check_z_tokens.py
        working-directory: .

  skip-tracker:
    name: Skip-tracker (warning only)
    runs-on: ubuntu-latest
    # Жёлтая проверка: никогда не роняет билд. Если что-то сломается
    # внутри скрипта — continue-on-error на всякий случай.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run skip-tracker
        run: python3 scripts/check_skipped_tests.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  # S4 regression guard: dry-run checks of scripts/e2e-shard-start.sh
  # (DB-wipe guard, SHARD_ID whitelist, NEXT_DIST_DIR export). Runs on
  # stubs — no browsers, no backend, no services.
  shard-script-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run e2e-shard-start dryrun test
        run: bash scripts/e2e-shard-start.dryrun.test.sh

  # GH #415: 4 native Playwright shards (spec §3.2). One project (--project=e2e),
  # tests split via --shard=i/4; each matrix entry starts its OWN stack
  # (e2e-shard-start.sh) on its port pair. Check names keep today's informative
  # style: e2e-tests (1, 3002, 8001) … e2e-tests (4, 3005, 8004).
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            shard-port: 3002
            backend-port: 8001
          - shard: 2
            shard-port: 3003
            backend-port: 8002
          - shard: 3
            shard-port: 3004
            backend-port: 8003
          - shard: 4
            shard-port: 3005
            backend-port: 8004

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install backend dependencies
        run: uv sync --extra dev
        working-directory: backend

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/admin

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/admin

      # CI guard (#209, #415): fail EARLY if the shard resolves 0 spec files
      # (bad --project/--shard args, config/testMatch regression) — before the
      # stack starts. `--list` prints spec paths to stdout only; stderr
      # (config-error traces with absolute .spec.ts paths) is NOT scanned.
      - name: Spec-file guard (shard ${{ matrix.shard }}/4)
        run: |
          list_output=$(mktemp)
          if ! pnpm exec playwright test --project=e2e --shard=${{ matrix.shard }}/4 --list > "$list_output"; then
            echo "ERROR: playwright --list failed for --project=e2e --shard=${{ matrix.shard }}/4."
            echo "Likely cause: bad --project/--shard args vs playwright.config.ts."
            rm -f "$list_output"
            exit 1
          fi
          spec_count=$(grep -c '\.spec\.ts' "$list_output" || true)
          rm -f "$list_output"
          if [ "$spec_count" -eq 0 ]; then
            echo "ERROR: shard ${{ matrix.shard }}/4 resolved 0 spec files."
            echo "Likely cause: config/testMatch regression or spec files swept"
            echo "out of e2e/ (frontend/admin/playwright.config.ts)."
            exit 1
          fi
          echo "Spec-file guard OK: ${spec_count} spec files in shard ${{ matrix.shard }}/4."
        working-directory: frontend/admin
        env:
          SHARD_ID: ${{ matrix.shard }}
          SHARD_PORT: ${{ matrix.shard-port }}
          BACKEND_PORT: ${{ matrix.backend-port }}
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_shard${{ matrix.shard }}.db
          BACKEND_URL: http://127.0.0.1:${{ matrix.backend-port }}
          NEXT_PUBLIC_API_URL: http://127.0.0.1:${{ matrix.backend-port }}

      - name: Start E2E stack (shard ${{ matrix.shard }})
        run: |
          SHARD_ID=${{ matrix.shard }} \
          SHARD_PORT=${{ matrix.shard-port }} \
          BACKEND_PORT=${{ matrix.backend-port }} \
          TEST_DB_PATH=backend/test_memo_shard${{ matrix.shard }}.db \
          BACKEND_URL=http://127.0.0.1:${{ matrix.backend-port }} \
          NEXT_PUBLIC_API_URL=http://127.0.0.1:${{ matrix.backend-port }} \
            bash scripts/e2e-shard-start.sh &

          # Wait for frontend to be ready (up to 120s)
          echo "Waiting for frontend on :${{ matrix.shard-port }}..."
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${{ matrix.shard-port }}/" --max-time 30 2>/dev/null || echo "000")
            if echo "$code" | grep -qE "^(2|3)"; then
              echo "Frontend ready on :${{ matrix.shard-port }} (HTTP $code)"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "ERROR: Frontend failed to start on :${{ matrix.shard-port }}"
              exit 1
            fi
            sleep 1
          done
          # Buffer for Next.js compilation to stabilize
          sleep 10

      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        run: pnpm exec playwright test --project=e2e --shard=${{ matrix.shard }}/4 --workers=1
        working-directory: frontend/admin
        env:
          SHARD_ID: ${{ matrix.shard }}
          SHARD_PORT: ${{ matrix.shard-port }}
          BACKEND_PORT: ${{ matrix.backend-port }}
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_shard${{ matrix.shard }}.db
          BACKEND_URL: http://127.0.0.1:${{ matrix.backend-port }}
          NEXT_PUBLIC_API_URL: http://127.0.0.1:${{ matrix.backend-port }}

      # Flake gate (GH #415, spec §3.5): ≥1 flaky test → exit 1, the job goes
      # red even on an otherwise green run (merge blocked by green-CI gate).
      # Missing/broken results.json → warning, exit 0 (no flakes exist if the
      # run never started). Runs from the REPO ROOT — the results.json path is
      # relative to it. Kept BEFORE the artifact upload: a flake-red job must
      # still upload its HTML report (if: failure() becomes true).
      - name: Flake summary
        if: always()
        run: node scripts/e2e-report-summary.mjs frontend/admin/results.json

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: |
            frontend/admin/playwright-report/**
            frontend/admin/test-results/**
          if-no-files-found: warn
          retention-days: 7

