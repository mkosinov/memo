name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit
          - group: api
          - group: integration
          - group: misc
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests (${{ matrix.group }})
        run: uv run pytest -m ${{ matrix.group }} -v --tb=short

  backend-coverage:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check coverage threshold
        run: uv run pytest --cov=src --cov-report=xml --cov-fail-under=80 -n auto

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest (shard ${{ matrix.group }}/5)
        run: npx vitest run --shard=${{ matrix.group }}/5
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - name: z-token guard
        run: python3 scripts/check_z_tokens.py
        working-directory: .

  skip-tracker:
    name: Skip-tracker (warning only)
    runs-on: ubuntu-latest
    # Жёлтая проверка: никогда не роняет билд. Если что-то сломается
    # внутри скрипта — continue-on-error на всякий случай.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run skip-tracker
        run: python3 scripts/check_skipped_tests.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  # S4 regression guard: dry-run checks of scripts/e2e-shard-start.sh
  # (DB-wipe guard, SHARD_ID whitelist, NEXT_DIST_DIR export). Runs on
  # stubs — no browsers, no backend, no services.
  shard-script-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run e2e-shard-start dryrun test
        run: bash scripts/e2e-shard-start.dryrun.test.sh

  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard-name: shard-schedule
            shard-id: 1
            shard-port: 3002
            backend-port: 8001
          - shard-name: shard-rest
            shard-id: 2
            shard-port: 3003
            backend-port: 8002

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install backend dependencies
        run: uv sync --extra dev
        working-directory: backend

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/admin

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/admin

      # CI guard (#209): fail EARLY if the Playwright project resolves 0 spec
      # files (project-name typo in the matrix, testMatch filter regression,
      # or a worktree path swept by the regexes) — before the stack starts.
      # `--list` prints spec paths to stdout only; stderr (config-error traces
      # with absolute .spec.ts paths) is NOT scanned.
      - name: Spec-file guard (${{ matrix.shard-name }})
        run: |
          list_output=$(mktemp)
          if ! pnpm exec playwright test --project=${{ matrix.shard-name }} --list > "$list_output"; then
            echo "ERROR: playwright --list failed for project '${{ matrix.shard-name }}'."
            echo "Likely cause: project name typo in this job's matrix vs playwright.config.ts."
            rm -f "$list_output"
            exit 1
          fi
          spec_count=$(grep -c '\.spec\.ts' "$list_output" || true)
          rm -f "$list_output"
          if [ "$spec_count" -eq 0 ]; then
            echo "ERROR: project '${{ matrix.shard-name }}' resolved 0 spec files."
            echo "Likely cause: test-filter regression or worktree path swept by the"
            echo "testMatch regexes (frontend/admin/playwright.config.ts:118,125)."
            exit 1
          fi
          echo "Spec-file guard OK: ${spec_count} spec files in project '${{ matrix.shard-name }}'."
        working-directory: frontend/admin
        env:
          SHARD_ID: ${{ matrix.shard-id }}
          SHARD_PORT: ${{ matrix.shard-port }}
          BACKEND_PORT: ${{ matrix.backend-port }}
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_shard${{ matrix.shard-id }}.db
          BACKEND_URL: http://127.0.0.1:${{ matrix.backend-port }}
          NEXT_PUBLIC_API_URL: http://127.0.0.1:${{ matrix.backend-port }}

      - name: Start E2E stack (${{ matrix.shard-name }})
        run: |
          SHARD_ID=${{ matrix.shard-id }} \
          SHARD_PORT=${{ matrix.shard-port }} \
          BACKEND_PORT=${{ matrix.backend-port }} \
          TEST_DB_PATH=backend/test_memo_shard${{ matrix.shard-id }}.db \
          BACKEND_URL=http://127.0.0.1:${{ matrix.backend-port }} \
          NEXT_PUBLIC_API_URL=http://127.0.0.1:${{ matrix.backend-port }} \
            bash scripts/e2e-shard-start.sh &

          # Wait for frontend to be ready (up to 120s)
          echo "Waiting for frontend on :${{ matrix.shard-port }}..."
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${{ matrix.shard-port }}/" --max-time 30 2>/dev/null || echo "000")
            if echo "$code" | grep -qE "^(2|3)"; then
              echo "Frontend ready on :${{ matrix.shard-port }} (HTTP $code)"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "ERROR: Frontend failed to start on :${{ matrix.shard-port }}"
              exit 1
            fi
            sleep 1
          done
          # Buffer for Next.js compilation to stabilize
          sleep 10

      - name: Run Playwright tests (${{ matrix.shard-name }})
        run: pnpm exec playwright test --project=${{ matrix.shard-name }} --workers=1
        working-directory: frontend/admin
        env:
          SHARD_ID: ${{ matrix.shard-id }}
          SHARD_PORT: ${{ matrix.shard-port }}
          BACKEND_PORT: ${{ matrix.backend-port }}
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_shard${{ matrix.shard-id }}.db
          BACKEND_URL: http://127.0.0.1:${{ matrix.backend-port }}
          NEXT_PUBLIC_API_URL: http://127.0.0.1:${{ matrix.backend-port }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard-name }}
          path: frontend/admin/playwright-report/
          retention-days: 7

