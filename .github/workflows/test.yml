name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit
          - group: api
          - group: integration
          - group: misc
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests (${{ matrix.group }})
        run: uv run pytest -m ${{ matrix.group }} -v --tb=short

  backend-coverage:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check coverage threshold
        run: uv run pytest --cov=src --cov-fail-under=80

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest (group ${{ matrix.group }})
        run: |
          if [ "${{ matrix.group }}" = "1" ]; then
            npx vitest run --reporter=verbose __tests__/ClientCardModal.test.tsx __tests__/ClientInfoTab.test.tsx __tests__/ClientsContext.test.tsx
          elif [ "${{ matrix.group }}" = "2" ]; then
            npx vitest run --reporter=verbose __tests__/ClientRecordTab.layout.test.tsx __tests__/ClientRecordTab.interactions.test.tsx
          elif [ "${{ matrix.group }}" = "3" ]; then
            npx vitest run --reporter=verbose __tests__/ClientRecordTab.api.test.tsx __tests__/ClientsIntegration.test.tsx
          elif [ "${{ matrix.group }}" = "4" ]; then
            npx vitest run --reporter=verbose __tests__/ClientsTable.test.tsx __tests__/ClientsFilters.test.tsx __tests__/ClientsPage.test.tsx __tests__/CustomSelect.test.tsx __tests__/RecordsTable.test.tsx
          else
            npx vitest run --reporter=verbose --exclude='**/Client*.test.tsx' --exclude='**/CustomSelect.test.tsx' --exclude='**/RecordsTable.test.tsx' --exclude='**/ClientsIntegration.test.tsx'
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend/admin
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd backend
          uv run python -m src.seed
          uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          BACKEND_PID=$!
          cd ../frontend/admin
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          pnpm exec playwright test
          EXIT_CODE=$?
          kill $BACKEND_PID 2>/dev/null || true
          exit $EXIT_CODE
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_memo.db
          TEST_DB_PATH: ../../backend/test_memo.db
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
