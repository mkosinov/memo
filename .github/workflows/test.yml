name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # GH #416: один прогон всего набора с coverage-порогом вместо матрицы по
  # маркерам (4 джоба) + отдельного coverage-джоба. Каждый тест выполняется
  # ровно один раз; тесты без меток проверяются тем же прогоном. Маркеры
  # unit/api/integration/misc/pure_unit остаются локальными селекторами
  # (pytest -m …) — CI их не потребляет. Отказы: verbose-вывод + junit-артефакт.
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests (full suite, coverage threshold 80%)
        run: uv run pytest --cov=src --cov-report=xml --cov-fail-under=80 -n auto -v --tb=short --junitxml=test-results.xml

      - name: Upload junit results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: backend/test-results.xml
          if-no-files-found: warn
          retention-days: 7


  # GH #483 (spec §3.6): the ENABLED notify contour. Marked `redis` tests
  # run against a REAL Redis service container; after that unit layer the
  # SAME job boots the enabled e2e stack (NOTIFY_E2E_ENABLED=1) against the
  # same container, runs the single S1 Playwright scenario and re-checks
  # the queue with the marked backend test. The default `backend-tests`
  # job above stays byte-identical (S2 invariant: the standard run needs
  # no Redis); its 80% coverage threshold is protected by the
  # [tool.coverage.run] omit of the notify transport modules (they are
  # measured HERE instead). Empty-green guard: a `pytest -m redis` run
  # that collects nothing — or skips everything, e.g. because the service
  # container never came up — exits 0 and would show a green job that
  # proves nothing; the guard step turns that into a job failure.
  notify-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    env:
      REDIS_URL: redis://localhost:6379/0
      # Spec §7 fallback: flip to "0" to drop the e2e layer (stack + S1
      # scenario + marked queue check) without code surgery if the job
      # proves too heavy until #484; the marked unit layer always stays.
      NOTIFY_TESTS_E2E_ENABLED: "1"

    services:
      redis:
        # redis:7 line (7.4.11 at pinning time), pinned by manifest-list
        # digest — the contour needs a REAL Redis (Streams, groups).
        image: redis@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/admin

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/admin

      # ── Unit layer: marked tests against the service container ────────
      # #484 §3.3/§3.8: NOTIFY_CHANNEL_PRIORITY=mock — until part 4 the
      # part-3 channel registry knows only the mock channel; the default
      # "telegram" would trip the loud registry gate in any process that
      # resolves the priority against the registry.
      - name: Run marked notify tests (real Redis)
        run: uv run pytest -m redis -v --tb=short --junitxml=test-results.xml
        env:
          NOTIFY_CHANNEL_PRIORITY: mock

      # Empty-green guard (spec §3.6): the job MUST fail when 0 marked
      # tests were collected or every one of them was skipped — a green
      # run with zero executions is not evidence about the transport.
      - name: Empty-green guard
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("test-results.xml").getroot()
          except FileNotFoundError:
              print("GUARD FAILED: backend/test-results.xml not found — the pytest run produced no results.")
              sys.exit(1)

          ts = root if root.tag == "testsuite" else root.find("testsuite")
          if ts is None:
              print("GUARD FAILED: no <testsuite> element in test-results.xml.")
              sys.exit(1)

          total = int(ts.get("tests", "0"))
          skipped = int(ts.get("skipped", "0"))
          failures = int(ts.get("failures", "0"))
          errors = int(ts.get("errors", "0"))
          executed = total - skipped

          print(f"Marked run: total={total} executed={executed} skipped={skipped} failures={failures} errors={errors}")

          if total == 0:
              print("GUARD FAILED: 0 tests collected for `pytest -m redis` — the marker contour is empty (marker name regression in pyproject.toml / test files renamed?).")
              sys.exit(1)
          if executed < 1:
              print("GUARD FAILED: every marked test was SKIPPED — the job is green but proves nothing. Likely cause: REDIS_URL missing/unreachable (service container did not start, wrong URL/port) or the skipif guard tripped.")
              sys.exit(1)
          print("Guard OK: at least one marked test EXECUTED against real Redis.")
          PY

      # ── E2E layer: enabled stack + S1 (gated, spec §7 fallback) ────────
      # CI guard (as in e2e-tests): fail EARLY if the S1 spec resolves 0
      # files, before the stack starts.
      - name: Spec-file guard (notify S1)
        if: env.NOTIFY_TESTS_E2E_ENABLED == '1'
        run: |
          list_output=$(mktemp)
          if ! pnpm exec playwright test --project=e2e --list e2e/notify-s1-enabled-stack.spec.ts > "$list_output"; then
            echo "ERROR: playwright --list failed for e2e/notify-s1-enabled-stack.spec.ts."
            echo "Likely cause: bad --project arg vs playwright.config.ts or a spec import error."
            rm -f "$list_output"
            exit 1
          fi
          spec_count=$(grep -c '\.spec\.ts' "$list_output" || true)
          rm -f "$list_output"
          if [ "$spec_count" -eq 0 ]; then
            echo "ERROR: notify S1 spec resolved 0 spec files (config/testMatch regression)."
            exit 1
          fi
          echo "Spec-file guard OK: notify S1 spec resolved."
        working-directory: frontend/admin
        env:
          NOTIFY_E2E_ENABLED: "1"
          SHARD_PORT: "3006"
          BACKEND_URL: http://127.0.0.1:8005
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8005
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_notify_e2e.db

      - name: Start notify e2e stack (enabled contour)
        if: env.NOTIFY_TESTS_E2E_ENABLED == '1'
        # #484: NOTIFY_CHANNEL_PRIORITY=mock rides the job env into the
        # stack's notify children (the shard script exports it as well —
        # belt and braces for the enabled contours until part 4).
        env:
          NOTIFY_CHANNEL_PRIORITY: mock
        run: |
          NOTIFY_E2E_ENABLED=1 \
          SHARD_ID=notify \
          SHARD_PORT=3006 \
          BACKEND_PORT=8005 \
          TEST_DB_PATH=backend/test_memo_notify_e2e.db \
          BACKEND_URL=http://127.0.0.1:8005 \
          NEXT_PUBLIC_API_URL=http://127.0.0.1:8005 \
            bash scripts/e2e-shard-start.sh &

          # Wait for frontend to be ready (up to 120s)
          echo "Waiting for frontend on :3006..."
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3006/" --max-time 30 2>/dev/null || echo "000")
            if echo "$code" | grep -qE "^(2|3)"; then
              echo "Frontend ready on :3006 (HTTP $code)"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "ERROR: Frontend failed to start on :3006"
              exit 1
            fi
            sleep 1
          done
          # Buffer for Next.js compilation to stabilize
          sleep 10
        working-directory: .

      - name: Run Playwright S1 scenario (enabled stack)
        if: env.NOTIFY_TESTS_E2E_ENABLED == '1'
        run: pnpm exec playwright test --project=e2e e2e/notify-s1-enabled-stack.spec.ts --workers=1
        working-directory: frontend/admin
        env:
          NOTIFY_E2E_ENABLED: "1"
          NOTIFY_CHANNEL_PRIORITY: mock
          SHARD_PORT: "3006"
          BACKEND_URL: http://127.0.0.1:8005
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8005
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_notify_e2e.db

      # Spec §3.6: after the S1 scenario — the marked queue check: the
      # stream holds ≥ 1 task with the §4.2 payload, correlated with the
      # stack DB (REDIS_URL comes from the job env — the service container).
      - name: Marked S1 queue check (stream ↔ stack DB)
        if: env.NOTIFY_TESTS_E2E_ENABLED == '1'
        run: uv run pytest tests/test_notify_redis_s1_queue.py -v --tb=short
        env:
          NOTIFY_CHANNEL_PRIORITY: mock
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_notify_e2e.db

      - name: Upload Playwright report (notify S1)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-notify
          path: |
            frontend/admin/playwright-report/**
            frontend/admin/test-results/**
          if-no-files-found: warn
          retention-days: 7


  # Рахет-гейт lint/mypy (#306): быстрый сигнал, параллельно тестам —
  # без needs. Скрипт в PR-режиме делает git show <merge-base>:… —
  # checkout требует полную историю (fetch-depth: 0).
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint budget (ruff/mypy ratchet)
        run: uv run python scripts/lint_budget.py

  # GH #420: single run, no shards. The 2026-06 sharding existed to survive
  # OOM from heavy ClientRecordTab files — those were since split up and the
  # 4 GB NODE_OPTIONS limit is in place. Fallback if OOM returns: split into
  # 2–3 shards INSIDE this same job (still one check in the PR).
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: npx vitest run
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # GH #420: unit tests of every OTHER workspace package (packages/domain,
  # packages/api-client, frontend/web) — previously run by no gate at all.
  # The package list is derived from the workspace globs by the shared
  # scripts/run-workspace-tests.sh (also used by the local full suite), so a
  # new package with a test script joins this job automatically.
  workspace-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Run workspace unit tests
        run: bash scripts/run-workspace-tests.sh


  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      # Gate #322: api-client test fixtures are invisible to admin's tsc
      # (not imported anywhere) — check the package itself.
      - name: Type-check api-client
        run: pnpm run type-check
        working-directory: packages/api-client
      - name: z-token guard
        run: python3 scripts/check_z_tokens.py
        working-directory: .

  skip-tracker:
    name: Skip-tracker (warning only)
    runs-on: ubuntu-latest
    # Жёлтая проверка: никогда не роняет билд. Если что-то сломается
    # внутри скрипта — continue-on-error на всякий случай.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run skip-tracker
        run: python3 scripts/check_skipped_tests.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  # S4 regression guard: dry-run checks of scripts/e2e-shard-start.sh
  # (DB-wipe guard, SHARD_ID whitelist, NEXT_DIST_DIR export). Runs on
  # stubs — no browsers, no backend, no services.
  shard-script-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run e2e-shard-start dryrun test
        run: bash scripts/e2e-shard-start.dryrun.test.sh

  # GH #415: 4 native Playwright shards (spec §3.2). One project (--project=e2e),
  # tests split via --shard=i/4; each matrix entry starts its OWN stack
  # (e2e-shard-start.sh) on its port pair. Check names keep today's informative
  # style: e2e-tests (1, 3002, 8001) … e2e-tests (4, 3005, 8004).
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            shard-port: 3002
            backend-port: 8001
          - shard: 2
            shard-port: 3003
            backend-port: 8002
          - shard: 3
            shard-port: 3004
            backend-port: 8003
          - shard: 4
            shard-port: 3005
            backend-port: 8004

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install backend dependencies
        run: uv sync --extra dev
        working-directory: backend

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/admin

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/admin

      # CI guard (#209, #415): fail EARLY if the shard resolves 0 spec files
      # (bad --project/--shard args, config/testMatch regression) — before the
      # stack starts. `--list` prints spec paths to stdout only; stderr
      # (config-error traces with absolute .spec.ts paths) is NOT scanned.
      - name: Spec-file guard (shard ${{ matrix.shard }}/4)
        run: |
          list_output=$(mktemp)
          if ! pnpm exec playwright test --project=e2e --shard=${{ matrix.shard }}/4 --list > "$list_output"; then
            echo "ERROR: playwright --list failed for --project=e2e --shard=${{ matrix.shard }}/4."
            echo "Likely cause: bad --project/--shard args vs playwright.config.ts."
            rm -f "$list_output"
            exit 1
          fi
          spec_count=$(grep -c '\.spec\.ts' "$list_output" || true)
          rm -f "$list_output"
          if [ "$spec_count" -eq 0 ]; then
            echo "ERROR: shard ${{ matrix.shard }}/4 resolved 0 spec files."
            echo "Likely cause: config/testMatch regression or spec files swept"
            echo "out of e2e/ (frontend/admin/playwright.config.ts)."
            exit 1
          fi
          echo "Spec-file guard OK: ${spec_count} spec files in shard ${{ matrix.shard }}/4."
        working-directory: frontend/admin
        env:
          SHARD_ID: ${{ matrix.shard }}
          SHARD_PORT: ${{ matrix.shard-port }}
          BACKEND_PORT: ${{ matrix.backend-port }}
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_shard${{ matrix.shard }}.db
          BACKEND_URL: http://127.0.0.1:${{ matrix.backend-port }}
          NEXT_PUBLIC_API_URL: http://127.0.0.1:${{ matrix.backend-port }}

      - name: Start E2E stack (shard ${{ matrix.shard }})
        run: |
          SHARD_ID=${{ matrix.shard }} \
          SHARD_PORT=${{ matrix.shard-port }} \
          BACKEND_PORT=${{ matrix.backend-port }} \
          TEST_DB_PATH=backend/test_memo_shard${{ matrix.shard }}.db \
          BACKEND_URL=http://127.0.0.1:${{ matrix.backend-port }} \
          NEXT_PUBLIC_API_URL=http://127.0.0.1:${{ matrix.backend-port }} \
            bash scripts/e2e-shard-start.sh &

          # Wait for frontend to be ready (up to 120s)
          echo "Waiting for frontend on :${{ matrix.shard-port }}..."
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${{ matrix.shard-port }}/" --max-time 30 2>/dev/null || echo "000")
            if echo "$code" | grep -qE "^(2|3)"; then
              echo "Frontend ready on :${{ matrix.shard-port }} (HTTP $code)"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "ERROR: Frontend failed to start on :${{ matrix.shard-port }}"
              exit 1
            fi
            sleep 1
          done
          # Buffer for Next.js compilation to stabilize
          sleep 10

      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        run: pnpm exec playwright test --project=e2e --shard=${{ matrix.shard }}/4 --workers=1
        working-directory: frontend/admin
        env:
          SHARD_ID: ${{ matrix.shard }}
          SHARD_PORT: ${{ matrix.shard-port }}
          BACKEND_PORT: ${{ matrix.backend-port }}
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_shard${{ matrix.shard }}.db
          BACKEND_URL: http://127.0.0.1:${{ matrix.backend-port }}
          NEXT_PUBLIC_API_URL: http://127.0.0.1:${{ matrix.backend-port }}

      # Flake gate (GH #415, spec §3.5): ≥1 flaky test → exit 1, the job goes
      # red even on an otherwise green run (merge blocked by green-CI gate).
      # Missing/broken results.json → warning, exit 0 (no flakes exist if the
      # run never started). Runs from the REPO ROOT — the results.json path is
      # relative to it. Kept BEFORE the artifact upload: a flake-red job must
      # still upload its HTML report (if: failure() becomes true).
      - name: Flake summary
        if: always()
        run: node scripts/e2e-report-summary.mjs frontend/admin/results.json

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: |
            frontend/admin/playwright-report/**
            frontend/admin/test-results/**
          if-no-files-found: warn
          retention-days: 7

