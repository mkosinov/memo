name: Update Snapshots (shard-rest)

# Manually-triggered workflow to regenerate Playwright `toHaveScreenshot`
# baselines for the `shard-rest` project ON the exact `ubuntu-latest` CI
# runner image. This guarantees the font stack / browser build matches the
# environment where the `e2e-tests` job runs, avoiding font-render drift.
#
# It mirrors the `e2e-tests` job in test.yml (shard-rest matrix entry:
# SHARD_ID=2, SHARD_PORT=3003, BACKEND_PORT=8002) but adds `--update-snapshots`.
#
# Regenerated PNGs are committed and pushed back to the dispatched branch
# automatically (#316): one dispatch → baselines committed exactly once;
# an empty diff skips the commit. The artifact upload stays as a manual
# fallback (e.g. if the push fails). Dispatches on the same branch are
# serialized by the `concurrency` group — no parallel double-triggers.
#
# Usage:
#   gh workflow run update-snapshots.yml --ref feat-ci-green
# Baselines land on that branch as a bot commit — no manual step.
#
# `mode` (default `changed`) maps to `playwright --update-snapshots=<mode>`:
# `changed` rewrites only failing comparisons (a test passing within
# maxDiffPixels keeps its old baseline); `all` rewrites every baseline
# unconditionally — the only way to refresh a baseline of a green test.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Snapshot update mode: changed (only failing) | all (rewrite every baseline)"
        type: choice
        options: [changed, all]
        default: changed

# Write-back (#316): the workflow pushes the baseline commit itself.
permissions:
  contents: write

# Serialize dispatches on the same branch (#316): a second dispatch waits
# for the running one instead of racing it (cancel-in-progress is off —
# killing a 20-minute run mid-flight would waste it; both runs are safe
# sequentially since each checks out the ref fresh at job start).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    env:
      SHARD_ID: 2
      SHARD_PORT: 3003
      BACKEND_PORT: 8002

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install backend dependencies
        run: uv sync --extra dev
        working-directory: backend

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/admin

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/admin

      # CI guard (#209): fail EARLY if the `shard-rest` Playwright project
      # resolves 0 spec files (project-name typo, testMatch filter regression,
      # or a worktree path swept by the regexes) — before the stack starts.
      # `--list` prints spec paths to stdout only; stderr (config-error traces
      # with absolute .spec.ts paths) is NOT scanned.
      - name: Spec-file guard (shard-rest)
        run: |
          list_output=$(mktemp)
          if ! pnpm exec playwright test --project=shard-rest --list > "$list_output"; then
            echo "ERROR: playwright --list failed for project 'shard-rest'."
            echo "Likely cause: project name typo vs playwright.config.ts."
            rm -f "$list_output"
            exit 1
          fi
          spec_count=$(grep -c '\.spec\.ts' "$list_output" || true)
          rm -f "$list_output"
          if [ "$spec_count" -eq 0 ]; then
            echo "ERROR: project 'shard-rest' resolved 0 spec files."
            echo "Likely cause: test-filter regression or worktree path swept by the"
            echo "testMatch regexes (frontend/admin/playwright.config.ts:118,125)."
            exit 1
          fi
          echo "Spec-file guard OK: ${spec_count} spec files in project 'shard-rest'."
        working-directory: frontend/admin
        env:
          SHARD_ID: 2
          SHARD_PORT: 3003
          BACKEND_PORT: 8002
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_shard2.db
          BACKEND_URL: http://127.0.0.1:8002
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8002

      - name: Start E2E stack (shard-rest)
        run: |
          SHARD_ID=2 \
          SHARD_PORT=3003 \
          BACKEND_PORT=8002 \
          TEST_DB_PATH=backend/test_memo_shard2.db \
          BACKEND_URL=http://127.0.0.1:8002 \
          NEXT_PUBLIC_API_URL=http://127.0.0.1:8002 \
            bash scripts/e2e-shard-start.sh &

          # Wait for frontend to be ready (up to 120s)
          echo "Waiting for frontend on :3003..."
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3003/" --max-time 30 2>/dev/null || echo "000")
            if echo "$code" | grep -qE "^(2|3)"; then
              echo "Frontend ready on :3003 (HTTP $code)"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "ERROR: Frontend failed to start on :3003"
              exit 1
            fi
            sleep 1
          done
          # Buffer for Next.js compilation to stabilize
          sleep 10

      - name: Regenerate shard-rest snapshots
        run: pnpm exec playwright test --project=shard-rest --update-snapshots=${{ inputs.mode }} --workers=1
        working-directory: frontend/admin
        env:
          SHARD_ID: 2
          SHARD_PORT: 3003
          BACKEND_PORT: 8002
          TEST_DB_PATH: ${{ github.workspace }}/backend/test_memo_shard2.db
          BACKEND_URL: http://127.0.0.1:8002
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8002

      # #316: commit the regenerated PNGs and push them to the dispatched
      # branch. Empty diff (nothing regenerated / all within maxDiffPixels)
      # → clean skip. On push failure the step fails and the artifact below
      # remains the manual fallback.
      - name: Commit and push regenerated snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'frontend/admin/e2e/**/*-snapshots/**'
          if git diff --cached --quiet; then
            echo "No snapshot changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(snapshots): regenerate shard-rest baselines (mode=${{ inputs.mode }}, run ${{ github.run_number }})"
          git push

      - name: Upload updated snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots-shard-rest
          path: frontend/admin/e2e/**/*-snapshots/**
          retention-days: 7
