[project]
name = "memo-backend"
version = "0.1.0"
description = "Memo art studio management backend — ColourMountains"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "sqladmin>=0.20.0",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.6.0",
    "alembic>=1.18.4",
    "pwdlib[argon2]>=0.3.1",
    # GH #262 Task 2 — multipart/form-data parsing for POST /my/portrait
    "python-multipart>=0.0.20",
    # GH #482 — template rendering for notify messages (spec §3.5).
    # Floor 3.1.6: CVE-2025-27516 (sandbox escape via |attr, fixed in 3.1.6).
    "jinja2>=3.1.6",
    # GH #483 — Redis Streams transport for notify queue (spec §3.1, ADR 013).
    # Floor: version actually smoke-tested against Redis 7 (XADD/XREADGROUP/XACK/XAUTOCLAIM).
    "redis>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    # GH #306 Task 5 — типы для wtforms (sqladmin тянется к wtforms-полям):
    # гасит [import-untyped] в src/admin/setup.py честными штампами.
    "types-WTForms>=3.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

# ── Ruff ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

# GH #306 волна 0 — FastAPI-декларации в дефолтах параметров легитимны:
# Depends/Query/... — иммутабельные маркеры DI, не «вызов в дефолте» (B008).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Cookie",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# Cyrillic string literals in tests are domain data (names, specialties,
# titles), not ambiguous-charset bugs — RUF001/002/003 are false positives
# for a Russian-language domain model.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001", "RUF002", "RUF003"]

# ── Mypy ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── Pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Fast tests, no DB (schemas, utils, validation)",
    "pure_unit: Fast tests, NO database (pydantic, validation, pure logic)",
    "api: API endpoint tests (CRUD, status codes)",
    "integration: Complex flows, multi-step scenarios",
    "misc: Infrastructure, health, CORS, admin",
    # GH #483 §3.6 — notify transport contour: real Redis, needs REDIS_URL;
    # declarative skipif keeps the standard no-Redis run green (US-7/S2).
    "redis: Notify transport integration tests against a real Redis (need REDIS_URL; skipped without it)",
]
addopts = []

# ── Coverage ───────────────────────────────────────────────────────
[tool.coverage.run]
# GH #483 §3.6 / #484 §3.8 — the notify transport adapter is measured by
# the dedicated `notify-tests` CI contour (pytest -m redis), NOT by the
# standard backend job: there its contour tests skip without Redis, and
# counting the near-unexecuted adapter would drag the 80% gate down.
# worker.py is BACK in the standard measurement (#484 §3.8): its unit
# layer (S9 contract) runs without Redis.
omit = [
    "src/seed/*",
    "src/notify/redis_queue.py",
]
