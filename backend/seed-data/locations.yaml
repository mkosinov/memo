# ЛОКАЦИИ (студии). Заполняется один раз перед запуском в проде.
#
# Как это работает:
#   - title — обязателен. По нему скрипт находит уже существующую запись:
#     повторный запуск ОБНОВИТ её, а не создаст дубль. Переименование title
#     после первой заливки = новая запись (переименовывайте в админке).
#   - capacity — обязателен (сколько человек помещается).
#   - tags — названия тегов из tags.yaml (или пустой список []).
#   - "" (пустая строка) = поле остаётся пустым.
#   - image_url — путь к картинке в репозитории фронта (frontend/web/public),
#     например "/images/hero-bg.jpg".
#   - is_public — видно ли локацию клиентам на сайте (true/false,GH #601).
#     false = скрыта только с сайта, в админке полностью рабочая.
#     Конвертация из CSV владельца (колонка «видно клиентам», спека §2.7):
#     пусто или «да» → is_public: true, «нет» → is_public: false.
#
# Проверка файла без записи в БД:
#   cd backend && uv run python -m src.seed.reference --check
#
# Ниже — текущие данные студии из dev-сида: проверьте и поправьте под прод.

