# МАТЕРИАЛЫ — справочник техник/материалов, на который ссылаются услуги.
#
# Услуги ссылаются на материал ПО НАЗВАНИЮ (блок materials в services.yaml),
# название уникально. note (в услуге) — необязательная заметка про материал
# именно для этой услуги; если пусто, на сайте покажется description.
#
# Проверка: cd backend && uv run python -m src.seed.reference --check

materials:
  - title: Масло
    description: "Масляные краски — классика живописи. Густые, насыщенные, сохнут долго."

  - title: Акрил
    description: "Акриловые краски — быстросохнущие, яркие, подходят для любых поверхностей."

  - title: Акварель
    description: "Акварельные краски — прозрачные, нежные, требуют специальной бумаги."

  - title: Гуашь
    description: "Гуашь — плотные матовые краски на водной основе, идеальны для детей."
