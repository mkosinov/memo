# УСЛУГИ (мастер-классы) вместе с тарифами, тегами и материалами.
#
# Правила:
#   - title — обязателен, по нему скрипт находит запись (повторный запуск
#     обновляет, а не дублирует).
#   - description — текст карточки на сайте (не пустой).
#   - image_url — картинка карточки, путь в репозитории фронта:
#     "/images/<файл>.jpg" (папка frontend/web/public/images).
#   - specialty — направление, до 20 символов (например «живопись», «керамика»).
#   - min_age / max_age — возраст в годах; max_age можно оставить пустым (null).
#   - duration — длительность в МИНУТАХ (не в часах!).
#   - record_info — текст-подсказка при записи (можно "").
#   - tags — названия из tags.yaml; materials — названия из materials.yaml.
#     note — заметка про материал для этой услуги ("" = показывать description).
#   - tariffs[].audience — кому тариф: kid (детский) | adult (взрослый) | all.
#     price — цена в рублях, целое число. Если удалить тариф из файла, он НЕ
#     удалится из базы (скрипт только предупредит) — удаляйте в админке.
#
# Проверка: cd backend && uv run python -m src.seed.reference --check
#
# Ниже — текущие данные студии из dev-сида: проверьте и поправьте под прод.

