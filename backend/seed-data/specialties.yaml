# НАПРАВЛЕНИЯ (справочник студии) — просто список названий.
#
# Правила:
#   - Название — одно направление; пустые строки не нужны.
#   - Уникальность без учёта регистра: «Живопись» и «живопись» — это одно
#     направление, перечислять оба нельзя (ошибка загрузки).
#   - Услуги (services.yaml, поле specialty) и мастера (staff.yaml, блок
#     master, поле specialties) ссылаются на названия из этого списка;
#     регистр не важен. Неизвестное название — ошибка загрузки.
#   - Переименовать направление можно в админке (вкладка «Направления»
#     на странице услуг); повторный запуск загрузчика не переименовывает.
#
# Проверка: cd backend && uv run python -m src.seed.reference --check
#
# Ниже — текущие данные студии из dev-сида: проверьте и поправьте под прод.

specialties:
  - Живопись
  - Керамика
  - Декор
