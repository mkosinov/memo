# СОТРУДНИКИ и их блок «мастер» (участие в расписании), плюс должности.
#
# Правила:
#   - Сотрудник ищется по паре first_name + last_name (повторный запуск
#     обновляет запись, а не дублирует). ФИО пишите так, как должно быть
#     видно в админке; полное совпадение имени и фамилии у двух людей
#     невозможно — для тёзок добавьте инициал в фамилию.
#   - positions — названия должностей. «Мастер» и «Администратор» уже есть
#     в БД (системные) — их можно не объявлять в блоке positions.
#     Остальные должности объявите в positions ниже; скрипт их создаст.
#     Должность влияет только на зарплатный модуль, не на доступ.
#   - master — блок расписания. Есть блок = человек стоит в расписании
#     мастером. Нет блока = сотрудник без расписания (администратор, СММ…).
#       specialty — обязательна; можно несколько через запятую:
#                   specialty: "живопись, керамика"
#       color     — цвет в расписании, ровно #RRGGBB
#       is_active — участвует ли в распределении занятий (true/false)
#   - avatar_url — путь к фото в репозитории фронта, можно "".
#   - Если убрать блок master у уже залитого сотрудника, запись в расписании
#     останется — архив/удаление мастера делается в админке.
#
# Проверка: cd backend && uv run python -m src.seed.reference --check
#
# Ниже — текущие данные студии из dev-сида: проверьте и поправьте под прод.

positions:
  - title: Мастер
  - title: Администратор
  - title: СММ

