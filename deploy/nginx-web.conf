# Web server config (GH #616, spec §3.1): serves the Next static export
# copied to the nginx document root by Dockerfile.web. Deliberately minimal:
# no TLS and no server_name assumptions — the VPS edge proxy (#617)
# terminates TLS/owns domains and forwards here; this server just answers
# on its own port.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build output: immutable.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Next static export emits flat <route>.html files: serve clean URLs via
    # $uri.html, real files/dirs directly, and fall back to the SPA shell
    # (/index.html) for unknown deep links so the client router handles
    # them.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
