# Web server config (GH #616, spec §3.1): serves the Next static export
# copied to the nginx document root by Dockerfile.web. Deliberately minimal:
# no TLS and no server_name assumptions — the VPS edge proxy (#617)
# terminates TLS/owns domains and forwards here; this server just answers
# on its own port.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Hardening baseline (GH #616 review): no nginx version in headers/error
    # pages, no MIME sniffing, gzip for compressible text-ish types.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build output: immutable.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header does NOT inherit into a level that declares its own
        # (the Cache-Control line above) — re-declare or these assets lose
        # the nosniff guard.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Next static export emits flat <route>.html files (and <route>/ dirs for
    # nested routes WITHOUT index.html inside): serve clean URLs via
    # $uri.html, directory-style routes via $uri/index.html (NOT $uri/ — a
    # bare directory match 301s to a trailing slash, and the slash variant
    # 403s because these dirs have no index.html), then fall back to the SPA
    # shell (/index.html) for unknown deep links so the client router
    # handles them.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
