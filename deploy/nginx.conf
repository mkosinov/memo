# Edge config (GH #616, spec §3.1–3.2 rev.4+): the ONLY nginx in the stack —
# terminates TLS and routes the whole site. Installed as /etc/nginx/conf.d/
# default.conf by Dockerfile.edge.
#
# Mount contract — compose wires EXACTLY these paths; without them the 443
# server refuses to start (by design: prod runs only with real certs):
#   /etc/nginx/certs/fullchain.pem  (ro)  TLS cert chain   — issued/renewed
#   /etc/nginx/certs/privkey.pem    (ro)  TLS private key    by card #617
#   /var/www/acme                   (ro)  ACME HTTP-01 webroot; #617's
#                                          certbot writes challenges under
#                                          /var/www/acme/.well-known/acme-challenge/
#                                          on the host, compose bind-mounts
#                                          the webroot to this path
#   /var/www/media-public           (ro)  host /opt/memo/media/public — the
#                                          PUBLIC subtree of the media tree,
#                                          served under /images/public/
#
# Canonical host (GH #574): the ONE canonical name is colourmountains.ru;
# every other host (www.colourmountains.ru, xn--b1acfa3biol7a6ce.xn--p1ai)
# is non-canonical and must land on the canonical in ONE hop. http-level
# map (conf.d fragments are included inside http {}): 1 = non-canonical.
map $host $memo_noncanon {
    hostnames;
    default 1;
    colourmountains.ru 0;
}

# ACME first: HTTP answers only the challenge requests the certbot renewal
# needs, plus the one health-probe path below; everything else is bounced
# to https.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Deploy health-wait (spec §4.2): deploy.sh probes
    # http://127.0.0.1/api/v1/health FROM THE VPS HOST — through edge, so
    # the wait covers the whole nginx → backend → DB chain. NO source-IP
    # guard: behind docker's userland proxy a probe from the host to the
    # published port arrives with the docker-proxy source IP (the compose
    # network gateway), NOT 127.0.0.1 — an allow-list here would 403 the
    # deploy probe itself, and every other client becomes the same gateway
    # address anyway, so the restriction gates nothing. The endpoint is
    # unauthenticated by design with identical exposure via 443; the
    # plain-http surface stays ACME + this one exact path. Exact match, so
    # the blanket 301 below keeps covering everything else.
    location = /api/v1/health {
        # Request-time upstream resolution — same mechanics and reasons as
        # the 443 /api/ location (comment there): a literal
        # `proxy_pass http://backend:8000` resolves the name once at
        # config-parse time, so nginx -t / startup would fail whenever
        # backend is not resolvable yet (edge starting before backend).
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        # Same proxy headers as the 443 /api/ location.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Certificates are host mounts (see the contract above); issuance and
    # renewal belong to the provisioning card #617, not to this image.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS only; sane session settings (Mozilla intermediate posture).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Hardening baseline (carried over from the round-1 nginx-web.conf):
    # no nginx version in headers/error pages, no MIME sniffing, gzip for
    # compressible text-ish types, HSTS for the HTTPS-only posture (:80
    # redirects everything; the health exact-match path is the sole
    # plain-http exception).
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # API uploads go through this proxy: the backend's only upload is the
    # avatar (5 MB hard limit + 64 KiB multipart slack — MAX_AVATAR_BYTES /
    # MP_SLACK_BYTES in backend/src/services/files.py, spec §3.4); 16m is
    # that with ~3x headroom so nginx never rejects what the app accepts.
    client_max_body_size 16m;

    root /usr/share/nginx/html;
    index index.html;

    # Upstreams are compose service names resolved by docker's embedded DNS
    # (127.0.0.11, present on every user-defined compose network). proxy_pass
    # goes through VARIABLES deliberately: a literal `proxy_pass
    # http://backend:8000` resolves the name ONCE at config-parse time, so
    # nginx refuses to start (and `nginx -t` fails) whenever backend/admin is
    # not resolvable at that moment — e.g. edge starting before backend, or a
    # backend restart. The variable form defers resolution to request time
    # and re-resolves per valid= window. The variable value carries NO URI
    # part, so the request path is passed through untouched (same as a URI-
    # less literal proxy_pass).
    resolver 127.0.0.11 valid=10s;

    # Canonical-host redirect (GH #574, spec §«Edge: редирект не-канонов»):
    # 443 serves ALL three names with the one SAN cert, but only requests
    # for the canonical host reach the app. Non-canonical hosts
    # (www.colourmountains.ru, xn--b1acfa3biol7a6ce.xn--p1ai, any other)
    # get a permanent redirect in ONE hop with path + query preserved
    # ($request_uri). Status 301 (permanent domain move), not the method-
    # preserving 308: the app always loads on the canon and talks to the
    # API same-origin, so no POST ever arrives on a non-canonical host.
    # Server-level if — NOT a location stanza (verify-edge.sh drift guard
    # mirrors locations only) and NOT on :80 (it would break ACME for
    # non-canonical names); the redirect fires before any app response,
    # so no cookies are set on it.
    if ($memo_noncanon) { return 301 https://colourmountains.ru$request_uri; }

    # Backend API. NO URI part in proxy_pass — the /api/ prefix is passed
    # through untouched (backend routes are mounted at /api/v1 itself).
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin app (Next standalone, compose service `admin`). It is BUILT with
    # basePath /admin and expects the prefix — proxy_pass without URI part
    # keeps it; do NOT strip.
    location /admin {
        set $admin_upstream http://admin:3000;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public media. Mount-level privacy boundary: ONLY the public subtree
    # (/opt/memo/media/public) is bind-mounted to /var/www/media-public —
    # this container physically cannot serve anything else from the media
    # tree, whatever a future config edit says. Existing URLs of the form
    # /images/public/services/… keep resolving to the same files.
    location /images/public/ {
        alias /var/www/media-public/;
    }

    # Content-hashed build output: immutable.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header does NOT inherit into a level that declares its own
        # (the Cache-Control line above) — re-declare or these assets lose
        # the nosniff guard.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Next static export emits flat <route>.html files (and <route>/ dirs for
    # nested routes WITHOUT index.html inside): serve clean URLs via
    # $uri.html, directory-style routes via $uri/index.html (NOT $uri/ — a
    # bare directory match 301s to a trailing slash, and the slash variant
    # 403s because these dirs have no index.html), then fall back to the SPA
    # shell (/index.html) for unknown deep links so the client router
    # handles them.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
