# Edge SMOKE config (GH #616): mirror of nginx.conf's ROUTING for
# environments without certs — the CI PR smoke job and local prod-smoke
# mount this file OVER /etc/nginx/conf.d/default.conf. Single port-80
# server, NO TLS block, NO ACME location; the locations, headers and body
# size are identical to the 443 server in nginx.conf.
#
# KEEP IN SYNC with nginx.conf routing — every routing change there is
# exercised through this mirror first (CI smoke + prod-smoke).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Hardening baseline — same as nginx.conf 443 server.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Same as nginx.conf: backend avatar limit 5 MB + 64 KiB slack
    # (backend/src/services/files.py, spec §3.4) with ~3x headroom.
    client_max_body_size 16m;

    root /usr/share/nginx/html;
    index index.html;

    # Same resolver/variable mechanics as nginx.conf (see there): request-
    # time resolution through docker's embedded DNS, so `nginx -t` and nginx
    # startup stay green without live backends.
    resolver 127.0.0.11 valid=10s;

    # Deploy health-wait route — the SAME exact-match /api/v1/health
    # location as nginx.conf :80, but WITHOUT the allow/deny guard: smoke
    # probes come via the published edge port and arrive with the
    # docker-proxy source IP, not 127.0.0.1; smoke serves plain HTTP only
    # anyway. KEEP IN SYNC with nginx.conf (file header).
    location = /api/v1/health {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API — same contract as nginx.conf (no URI rewrite).
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin app — same contract as nginx.conf (prefix kept, not stripped).
    location /admin {
        set $admin_upstream http://admin:3000;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public media — same mount contract as nginx.conf (public subtree only).
    location /images/public/ {
        alias /var/www/media-public/;
    }

    # Content-hashed build output: immutable.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback — same as nginx.conf.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
